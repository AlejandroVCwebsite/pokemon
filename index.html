
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BM Teacher Battle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game">
    <h1>BM Teacher Battle Arena</h1>

    <div id="stats">
      <span class="stat">XP: <strong id="xpText">0</strong></span>
      <span class="stat">Health: <strong id="healthText">100</strong></span>
      <span class="stat">Gold: <strong id="goldText">50</strong></span>
    </div>

    <div id="content">
      <img id="img" src="start.png" alt="Game scene" class="center">
    </div>

    <div id="controls">
      <button id="button1">Go to Shop</button>
      <button id="button2">Go to Castle</button>
      <button id="button3">Go to Cave</button>
      <button id="button4">Fight Boss</button>
    </div>

    <div id="monsterStats">
      <span class="stat">Teacher Name:
        <strong id="monsterName"></strong>
      </span>
      <span class="stat">Health:
        <strong id="monsterHealth"></strong>
      </span>
    </div>

    <div id="text">
      Welcome to the BM Teacher Battle Arena!
      You are in the dining room. Where do you want to go?
      Use the buttons above.
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
