<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Quest</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #101820;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    #gameWrapper {
        text-align: center;
        width: min(96vw, 768px);
    }

    h1 {
        margin: 0 0 8px;
        color: #f6d365;
        font-size: 26px;
    }

    #game {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
        border: 4px solid #d8b35a;
        background: #172b1c;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }

    #info {
        margin-top: 8px;
        color: #ddd;
        font-size: 14px;
    }

    #message {
        position: fixed;
        bottom: 65px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, .85);
        padding: 10px 18px;
        border-radius: 8px;
        display: none;
        z-index: 5;
        white-space: nowrap;
    }

    #navigation {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin: 12px;
        font-size: 13px;
    }

    #navigation a {
        color: #f6d365;
    }

    @media (max-height: 720px) {
        #gameWrapper {
            width: min(92vw, calc((100vh - 100px) * 4 / 3));
        }

        h1 {
            font-size: 21px;
        }

        #info {
            font-size: 12px;
        }
    }
</style>
</head>

<body>

<div id="gameWrapper">
    <h1>🌲 Forest Quest</h1>

    <canvas id="game" width="768" height="576"></canvas>

    <div id="info">
        Move: WASD / Arrows | Attack: SPACE | Interact: E
    </div>

<script src="app.js"></script>
</div>
<div id="message"></div>
</body>body>
</html>
