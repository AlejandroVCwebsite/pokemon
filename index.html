
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Quest</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            background: #101820;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }

        #gameWrapper {
            text-align: center;
            width: min(96vw, 768px);
        }

        h1 {
            margin: 0 0 8px;
            color: #f6d365;
            font-size: 26px;
        }

        #game {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            border: 4px solid #d8b35a;
            background: #172b1c;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #info {
            margin-top: 8px;
            color: #ddd;
            font-size: 14px;
            line-height: 1.5;
        }

        #message {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100vw - 24px);
            background: rgba(0, 0, 0, .88);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            display: none;
            z-index: 5;
            text-align: center;
        }

        @media (max-height: 720px) {
            body {
                padding: 8px;
            }

            #gameWrapper {
                width: min(92vw, calc((100vh - 110px) * 4 / 3));
            }

            h1 {
                font-size: 21px;
            }

            #info {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="gameWrapper">
        <h1>🌲 Forest Quest</h1>

        <canvas
            id="game"
            width="768"
            height="576"
            aria-label="Forest Quest game">
        </canvas>

        <div id="info">
            Move: WASD / Arrows | Attack: SPACE | Interact: E
        </div>
    </div>

    <div id="message" role="status" aria-live="polite"></div>

    <script src="app.js" defer></script>

</body>
</html>
